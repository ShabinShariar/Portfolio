    // ============================================================================
    // 1. PRECISION-SAFE POISHA MONETARY & SPLITTING ENGINE (1 BDT = 100 POISHA)
    // ============================================================================

    function bdtToPoisha(bdt) {
      const num = typeof bdt === 'string' ? parseFloat(bdt) : bdt;
      if (isNaN(num) || !isFinite(num)) return 0;
      return Math.round(num * 100);
    }

    function poishaToBdt(poisha) {
      return Math.round(poisha || 0) / 100;
    }

    function formatCurrency(poisha, symbol = '৳', alwaysShowDecimals = false) {
      const isNegative = (poisha || 0) < 0;
      const absPoisha = Math.abs(Math.round(poisha || 0));
      const bdt = absPoisha / 100;
      const hasFraction = absPoisha % 100 !== 0;

      const formatted = bdt.toLocaleString('en-IN', {
        minimumFractionDigits: hasFraction || alwaysShowDecimals ? 2 : 0,
        maximumFractionDigits: 2
      });

      return `${isNegative ? '-' : ''}${symbol}${formatted}`;
    }

    /**
     * Deterministic Fair Expense Splitting Algorithm in Poisha.
     * Divides `totalPoisha` strictly among `participantIds`.
     * Non-participants receive 0. Sum of shares === totalPoisha with 0 drift.
     */
    function calculateDeterministicSplit(totalPoisha, participantIds) {
      const k = (participantIds || []).length;
      if (k === 0 || totalPoisha <= 0) return [];
      const cleanTotal = Math.round(totalPoisha);
      const baseShare = Math.floor(cleanTotal / k);
      const remainder = cleanTotal % k;

      return participantIds.map((memberId, index) => ({
        memberId,
        sharePoisha: index < remainder ? baseShare + 1 : baseShare
      }));
    }

    function calculateTripFinancialSummary(trip, allMembers, tripContributions, tripExpenses) {
      const totalCollectedPoisha = tripContributions.reduce((sum, c) => sum + (c.amountPoisha || 0), 0);

      const tripFundExpensesPoisha = tripExpenses
        .filter((e) => e.paymentSource === 'trip_fund')
        .reduce((sum, e) => sum + (e.amountPoisha || 0), 0);

      const personalExpensesPoisha = tripExpenses
        .filter((e) => e.paymentSource === 'personal')
        .reduce((sum, e) => sum + (e.amountPoisha || 0), 0);

      const totalExpensesPoisha = tripFundExpensesPoisha + personalExpensesPoisha;
      const remainingFundCashPoisha = totalCollectedPoisha - tripFundExpensesPoisha;

      const involvedMemberIds = new Set(trip.memberIds || []);
      tripContributions.forEach((c) => {
        if (allMembers.some((m) => m.id === c.memberId)) involvedMemberIds.add(c.memberId);
      });
      tripExpenses.forEach((e) => {
        if (allMembers.some((m) => m.id === e.paidByMemberId)) involvedMemberIds.add(e.paidByMemberId);
        (e.participantIds || []).forEach((pid) => {
          if (allMembers.some((m) => m.id === pid)) involvedMemberIds.add(pid);
        });
        (e.allocations || []).forEach((a) => {
          if (allMembers.some((m) => m.id === a.memberId)) involvedMemberIds.add(a.memberId);
        });
      });

      const memberMap = new Map();
      allMembers.forEach((m) => memberMap.set(m.id, m));

      const memberFinancials = Array.from(involvedMemberIds).map((memberId) => {
        const member = memberMap.get(memberId);
        const contributedPoisha = tripContributions
          .filter((c) => c.memberId === memberId)
          .reduce((sum, c) => sum + (c.amountPoisha || 0), 0);

        const paidPersonallyPoisha = tripExpenses
          .filter((e) => e.paymentSource === 'personal' && e.paidByMemberId === memberId)
          .reduce((sum, e) => sum + (e.amountPoisha || 0), 0);

        let allocatedTripFundExpensePoisha = 0;
        let allocatedPersonalExpensePoisha = 0;
        let participatedExpenseCount = 0;

        tripExpenses.forEach((e) => {
          const alloc = (e.allocations || []).find((a) => a.memberId === memberId);
          if (alloc && alloc.sharePoisha > 0) {
            participatedExpenseCount += 1;
            if (e.paymentSource === 'trip_fund') {
              allocatedTripFundExpensePoisha += alloc.sharePoisha;
            } else {
              allocatedPersonalExpensePoisha += alloc.sharePoisha;
            }
          }
        });

        const totalAllocatedExpensePoisha =
          allocatedTripFundExpensePoisha + allocatedPersonalExpensePoisha;
        const totalCreditPoisha = contributedPoisha + paidPersonallyPoisha;
        const netBalancePoisha = totalCreditPoisha - totalAllocatedExpensePoisha;
        const personalReimbursementNetPoisha = paidPersonallyPoisha - allocatedPersonalExpensePoisha;

        return {
          memberId,
          memberName: member ? member.fullName : 'Member',
          avatarColor: member ? member.avatarColor : 'bg-emerald-600',
          isCurrentlyInTrip: (trip.memberIds || []).includes(memberId),
          contributedPoisha,
          paidPersonallyPoisha,
          totalCreditPoisha,
          allocatedTripFundExpensePoisha,
          allocatedPersonalExpensePoisha,
          totalAllocatedExpensePoisha,
          netBalancePoisha,
          personalReimbursementNetPoisha,
          participatedExpenseCount
        };
      });

      // Peer-to-peer personal expense reimbursements
      const personalDebtors = memberFinancials
        .filter((m) => m.personalReimbursementNetPoisha < 0)
        .map((m) => ({ id: m.memberId, name: m.memberName, amount: Math.abs(m.personalReimbursementNetPoisha) }))
        .sort((a, b) => b.amount - a.amount);

      const personalCreditors = memberFinancials
        .filter((m) => m.personalReimbursementNetPoisha > 0)
        .map((m) => ({ id: m.memberId, name: m.memberName, amount: m.personalReimbursementNetPoisha }))
        .sort((a, b) => b.amount - a.amount);

      const personalSettlementTransfers = [];
      let i = 0, j = 0;
      while (i < personalDebtors.length && j < personalCreditors.length) {
        const debtor = personalDebtors[i];
        const creditor = personalCreditors[j];
        const transfer = Math.min(debtor.amount, creditor.amount);
        if (transfer > 0) {
          personalSettlementTransfers.push({
            fromMemberId: debtor.id,
            fromMemberName: debtor.name,
            toMemberId: creditor.id,
            toMemberName: creditor.name,
            amountPoisha: transfer,
            type: 'PERSONAL_REIMBURSEMENT',
            explanation: `${debtor.name} reimburses ${creditor.name} for personally paid expenses`
          });
        }
        debtor.amount -= transfer;
        creditor.amount -= transfer;
        if (debtor.amount === 0) i++;
        if (creditor.amount === 0) j++;
      }

      // Final trip fund settlement
      const finalTripSettlementTransfers = [];
      memberFinancials.forEach((m) => {
        if (m.netBalancePoisha < 0) {
          finalTripSettlementTransfers.push({
            fromMemberId: m.memberId,
            fromMemberName: m.memberName,
            toMemberId: 'TRIP_FUND',
            toMemberName: 'Trip Fund / Organizer',
            amountPoisha: Math.abs(m.netBalancePoisha),
            type: 'FINAL_FUND_SETTLEMENT',
            explanation: `${m.memberName} pays outstanding deficit into Trip Fund`
          });
        } else if (m.netBalancePoisha > 0) {
          finalTripSettlementTransfers.push({
            fromMemberId: 'TRIP_FUND',
            fromMemberName: 'Trip Fund / Organizer',
            toMemberId: m.memberId,
            toMemberName: m.memberName,
            amountPoisha: m.netBalancePoisha,
            type: 'FINAL_FUND_SETTLEMENT',
            explanation: `Trip Fund refunds / reimburses ${m.memberName}'s net positive balance`
          });
        }
      });

      // Category breakdown
      const catMap = new Map();
      tripExpenses.forEach((e) => {
        const existing = catMap.get(e.category) || { amountPoisha: 0, count: 0 };
        catMap.set(e.category, {
          amountPoisha: existing.amountPoisha + e.amountPoisha,
          count: existing.count + 1
        });
      });

      const categoryBreakdown = Array.from(catMap.entries())
        .map(([category, data]) => ({ category, amountPoisha: data.amountPoisha, count: data.count }))
        .sort((a, b) => b.amountPoisha - a.amountPoisha);

      const budgetUtilizationPercent =
        trip.expectedBudgetPoisha > 0
          ? Math.round((totalExpensesPoisha / trip.expectedBudgetPoisha) * 1000) / 10
          : 0;

      return {
        tripId: trip.id,
        totalCollectedPoisha,
        tripFundExpensesPoisha,
        personalExpensesPoisha,
        totalExpensesPoisha,
        remainingFundCashPoisha,
        expectedBudgetPoisha: trip.expectedBudgetPoisha,
        budgetUtilizationPercent,
        memberFinancials,
        personalSettlementTransfers,
        finalTripSettlementTransfers,
        categoryBreakdown
      };
    }

    // 2. TIMEZONE (ASIA/DHAKA) & BILINGUAL HELPERS

    function getCurrentDhakaDateTimeInput() {
      try {
        const now = new Date();
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Dhaka',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).formatToParts(now);
        const getPart = (type) => parts.find((p) => p.type === type)?.value || '00';
        const hour = getPart('hour') === '24' ? '00' : getPart('hour');
        return `${getPart('year')}-${getPart('month')}-${getPart('day')}T${hour}:${getPart('minute')}`;
      } catch {
        return '2026-10-29T22:30';
      }
    }

    function formatDhakaDateTime(isoOrLocal) {
      if (!isoOrLocal) return '—';
      try {
        const date = new Date(isoOrLocal);
        if (isNaN(date.getTime())) return isoOrLocal.replace('T', ' ');
        return (
          new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Dhaka',
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
          }).format(date) + ' (BST)'
        );
      } catch {
        return isoOrLocal;
      }
    }

    // ============================================================================
    // 4. MULTI-SHEET EXCEL (.XLS XML) & CSV EXPORT HELPERS

    function generateMultiSheetExcelXml(trip, summary, expenses, contributions, members) {

        makeRow([{ val: 'Destination (Where)', bold: true }, { val: trip.destination }]),
        makeRow([{ val: 'Trip Duration (Dates)', bold: true }, { val: `${trip.startDate} to ${trip.endDate}` }]),
        makeRow([{ val: 'Trip Status', bold: true }, { val: trip.status }]),
        makeRow([{ val: 'Total Active Participants', bold: true }, { val: tripMembersList.length, type: 'Number' }]),
        makeRow([{ val: '' }]),
        makeRow([{ val: 'OVERALL FINANCIAL SUMMARY', bold: true }, { val: 'AMOUNT (BDT)', bold: true }, { val: 'DETAILS / EXPLANATION', bold: true }]),
        makeRow([{ val: 'Expected Trip Budget' }, { val: poishaToBdt(trip.expectedBudgetPoisha), type: 'Number' }, { val: 'Planned target budget' }]),
        makeRow([{ val: 'Total Money Deposited (Trip Fund)' }, { val: poishaToBdt(summary.totalCollectedPoisha), type: 'Number' }, { val: `Across ${sortedContribs.length} deposit transaction(s)` }]),
        makeRow([{ val: 'Total Expenses Paid From Trip Fund' }, { val: poishaToBdt(summary.tripFundExpensesPoisha), type: 'Number' }, { val: 'Deducted from collected group cash' }]),
        makeRow([{ val: 'Remaining Trip-Fund Cash in Hand', bold: true }, { val: poishaToBdt(summary.remainingFundCashPoisha), type: 'Number', bold: true }, { val: 'Total Deposited minus Trip-Fund Expenses', bold: true }]),
        makeRow([{ val: 'Total Expenses Paid Personally (Out-of-Pocket)' }, { val: poishaToBdt(summary.personalExpensesPoisha), type: 'Number' }, { val: 'Paid personally by members (reimbursable)' }]),

        { val: '' },
        { val: poishaToBdt(summary.totalExpensesPoisha), type: 'Number', bold: true },

        { val: '' },
        { val: '' },
        { val: '' },

        { val: 'SL #', bold: true },
        { val: 'Exact Date & Time (When)', bold: true },
        { val: 'Trip & Destination (Where)', bold: true },

          makeRow([

            { val: formatDhakaDateTime(c.dateTime) },
            { val: `${trip.name} (${trip.destination})` },

            { val: memberContact(c.memberId) },
            { val: poishaToBdt(c.amountPoisha), type: 'Number', bold: true },
            { val: c.paymentMethod },
            { val: c.reference || '—' },

        .join('\n');
      const sheet3TotalRow = makeRow([
        { val: '' },
        { val: 'TOTAL DEPOSITED', bold: true },
        { val: '' },

      // =========================================================================
      // SHEET 4: MEMBER-BY-MEMBER ITEMIZED PASSBOOK (EVERY PERSON'S A-Z HISTORY)

        sortedExpenses.forEach((e) => {

      let runningTripFundCash = 0;

    function generateCompleteAzCsv(trip, summary, expenses, contributions, members) {
      const memberName = (id) => members.find((m) => m.id === id)?.fullName || id;
      const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const tripMembersList = summary.memberFinancials.map((mf) => ({
        id: mf.memberId,
        name: mf.memberName
      }));

      const lines = [];
      lines.push([q('TRIPMATE COMPLETE A-TO-Z FINANCIAL REPORT'), q(trip.name), q(trip.destination), q(`${trip.startDate} to ${trip.endDate}`)].join(','));
      lines.push('');

      lines.push([q('SECTION 1: FINANCIAL SUMMARY'), q('AMOUNT (BDT)')].join(','));
      lines.push([q('Total Deposited to Trip Fund'), poishaToBdt(summary.totalCollectedPoisha).toFixed(2)].join(','));
      lines.push([q('Expenses Paid from Trip Fund'), poishaToBdt(summary.tripFundExpensesPoisha).toFixed(2)].join(','));
      lines.push([q('Remaining Trip-Fund Cash'), poishaToBdt(summary.remainingFundCashPoisha).toFixed(2)].join(','));
      lines.push([q('Expenses Paid Personally'), poishaToBdt(summary.personalExpensesPoisha).toFixed(2)].join(','));
      lines.push([q('Grand Total Trip Expenses'), poishaToBdt(summary.totalExpensesPoisha).toFixed(2)].join(','));
      lines.push('');

      lines.push([
        q('SECTION 2: DETAILED EXPENSES (WHEN, WHERE, WHO PAID, HOW MUCH)'),
        q('Date & Time (When)'),
        q('Location (Where)'),
        q('Expense Title (What)'),
        q('Category'),
        q('Paid By (Who)'),
        q('Payment Source'),
        q('Total Amount (BDT)'),
        q('Participants Included'),
        q('Excluded Members (0 BDT)'),
        ...tripMembersList.map((tm) => q(`${tm.name} Share (BDT)`)),
        q('Notes')
      ].join(','));

      expenses.forEach((e, i) => {
        const inc = (e.participantIds || []).map((id) => memberName(id)).join(' | ');
        const exc = tripMembersList.filter((tm) => !(e.participantIds || []).includes(tm.id)).map((tm) => tm.name).join(' | ') || 'None';
        const memberCols = tripMembersList.map((tm) => {
          const al = (e.allocations || []).find((a) => a.memberId === tm.id);
          return al ? poishaToBdt(al.sharePoisha).toFixed(2) : '0.00';
        });
        lines.push([
          i + 1,
          q(formatDhakaDateTime(e.dateTime)),
          q(`${trip.name} - ${trip.destination}`),
          q(e.title),
          q(e.category),
          q(memberName(e.paidByMemberId)),
          q(e.paymentSource === 'trip_fund' ? 'Trip Fund' : 'Personally Paid'),
          poishaToBdt(e.amountPoisha).toFixed(2),
          q(inc),
          q(exc),
          ...memberCols,
          q(e.notes || '')
        ].join(','));
      });
      lines.push('');

      lines.push([
        q('SECTION 3: FUND DEPOSITS (WHEN, WHO DEPOSITED, HOW MUCH)'),
        q('Date & Time (When)'),
        q('Location (Where)'),
        q('Member Name (Who)'),
        q('Amount Deposited (BDT)'),
        q('Payment Method'),
        q('Reference / TrxID')
      ].join(','));
      contributions.forEach((c, i) => {
        lines.push([
          i + 1,
          q(formatDhakaDateTime(c.dateTime)),
          q(`${trip.name} - ${trip.destination}`),
          q(memberName(c.memberId)),
          poishaToBdt(c.amountPoisha).toFixed(2),
          q(c.paymentMethod),
          q(c.reference || '')
        ].join(','));
      });
      lines.push('');

      lines.push([
        q('SECTION 4: MEMBER STANDINGS'),
        q('Participant Name'),
        q('Deposited (BDT)'),
        q('Paid Personally (BDT)'),
        q('Total Expense Share (BDT)'),
        q('Net Balance (BDT)')
      ].join(','));
      summary.memberFinancials.forEach((m, i) => {
        lines.push([
          i + 1,
          q(m.memberName),
          poishaToBdt(m.contributedPoisha).toFixed(2),
          poishaToBdt(m.paidPersonallyPoisha).toFixed(2),
          poishaToBdt(m.totalAllocatedExpensePoisha).toFixed(2),
          poishaToBdt(m.netBalancePoisha).toFixed(2)
        ].join(','));
      });

      return lines.join('\n');
    }

    function triggerFileDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function AddExpenseSection({
      state,

        editingExpense?.tripId ||
        (dashboardScope !== 'overall' && state.trips.some((t) => t.id === dashboardScope)

        '';

      const [tripId, setTripId] = useState(initialTripId);
      const selectedTrip = state.trips.find((tr) => tr.id === tripId) || state.trips[0];

      // Members currently assigned to this trip (or all members if trip has none)
      const tripMembers = useMemo(() => {
        if (!selectedTrip) return state.members;
        const assigned = state.members.filter((m) => (selectedTrip.memberIds || []).includes(m.id));
        return assigned.length > 0 ? assigned : state.members;
      }, [selectedTrip, state.members]);

      const [title, setTitle] = useState(editingExpense?.title || '');
      const [amountBdt, setAmountBdt] = useState(
        editingExpense ? String(poishaToBdt(editingExpense.amountPoisha)) : ''
      );
      const [category, setCategory] = useState(editingExpense?.category || 'Food');
      const [paymentSource, setPaymentSource] = useState(editingExpense?.paymentSource || 'trip_fund');
      const [paidByMemberId, setPaidByMemberId] = useState(
        editingExpense?.paidByMemberId || tripMembers[0]?.id || ''
      );
      const [participantIds, setParticipantIds] = useState(
        editingExpense?.participantIds || tripMembers.map((m) => m.id)
      );
      const [notes, setNotes] = useState(editingExpense?.notes || '');
      const [dateTime, setDateTime] = useState(
        editingExpense?.dateTime || getCurrentDhakaDateTimeInput()
      );
      const [quickMemberName, setQuickMemberName] = useState('');
      const [error, setError] = useState('');

      // Sync form when editingExpense changes
      useEffect(() => {
        if (editingExpense) {
          setTripId(editingExpense.tripId);
          setTitle(editingExpense.title);
          setAmountBdt(String(poishaToBdt(editingExpense.amountPoisha)));
          setCategory(editingExpense.category || 'Food');
          setPaymentSource(editingExpense.paymentSource || 'trip_fund');
          setPaidByMemberId(editingExpense.paidByMemberId);
          setParticipantIds(editingExpense.participantIds || []);

      // Ensure paidByMemberId stays valid if members change

    // ============================================================================

    const STORAGE_KEY = 'tripmate_gh_sheets_v2';

    function App() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.trips) && Array.isArray(parsed.members)) {
              return parsed;
            }
          }
        } catch (e) {}
        return createInitialSeedState();
      });

      const [activeNav, setActiveNav] = useState('dashboard');
      const [dashboardScope, setDashboardScope] = useState('trip_coxs_bazar');
      const [selectedTripId, setSelectedTripId] = useState('trip_coxs_bazar');
      const [toast, setToast] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);
      const [syncStatus, setSyncStatus] = useState('idle');

      // Modals & Controlled Form States
      const [tripModalOpen, setTripModalOpen] = useState(false);
      const [editingTrip, setEditingTrip] = useState(null);
      const [tripFormName, setTripFormName] = useState('');
      const [tripFormDest, setTripFormDest] = useState('');
      const [tripFormStart, setTripFormStart] = useState('2026-11-01');
      const [tripFormEnd, setTripFormEnd] = useState('2026-11-05');
      const [tripFormBudget, setTripFormBudget] = useState('12000');
      const [tripFormStatus, setTripFormStatus] = useState('Ongoing');
      const [tripFormMembers, setTripFormMembers] = useState([]);

      // Deposit Fund (Contribution) Controlled Modal State
      const [contributionModalOpen, setContributionModalOpen] = useState(false);
      const [editingContribution, setEditingContribution] = useState(null);
      const [contribTripId, setContribTripId] = useState('trip_coxs_bazar');
      const [contribMemberId, setContribMemberId] = useState('m_rahim');
      const [contribAmountBdt, setContribAmountBdt] = useState('');
      const [contribMethod, setContribMethod] = useState('Cash');
      const [contribRef, setContribRef] = useState('');
      const [contribNote, setContribNote] = useState('');
      const [contribDateTime, setContribDateTime] = useState(getCurrentDhakaDateTimeInput());

      // Member Add / Edit Controlled Modal State
      const [memberModalOpen, setMemberModalOpen] = useState(false);
      const [editingMember, setEditingMember] = useState(null);
      const [memberFormName, setMemberFormName] = useState('');
      const [memberFormContact, setMemberFormContact] = useState('');
      const [memberFormRole, setMemberFormRole] = useState('Member');

      // Expense being edited
      const [editingExpense, setEditingExpense] = useState(null);

      // Google Sheets URL input state
      const [scriptUrlInput, setScriptUrlInput] = useState(state.settings.googleScriptUrl || '');

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast((prev) => (prev?.message === message ? null : prev));
        }, 3500);
      };

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }, [state]);

      // Push current state to Google Sheets Web App
      const pushToGoogleSheets = async (customState = state, silent = false) => {
        const url = customState.settings.googleScriptUrl?.trim();
        if (!url) {
          if (!silent) showToast('Please paste your Google Apps Script Web App URL first!', 'error');
          return;
        }
        try {
          setSyncStatus('syncing');
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'sync', data: customState })
          });
          const result = await response.json();
          if (result.status === 'ok') {
            setSyncStatus('synced');
            setState((prev) => ({
              ...prev,
              settings: { ...prev.settings, lastSyncedAt: result.updatedAt || new Date().toLocaleTimeString() }
            }));
            if (!silent) showToast('Synced all trips & expenses to Google Sheets Database!');
          } else {
            setSyncStatus('error');
            if (!silent) showToast('Google Sheets error: ' + (result.message || 'Unknown'), 'error');
          }
        } catch (err) {
          setSyncStatus('error');
          if (!silent) showToast('Could not reach Google Sheets URL. Check deployment permissions ("Anyone").', 'error');
        }
      };

      const pullFromGoogleSheets = async () => {
        const url = state.settings.googleScriptUrl?.trim();
        if (!url) {
          showToast('Please paste your Google Apps Script Web App URL first!', 'error');
          return;
        }
        try {
          setSyncStatus('syncing');
          const response = await fetch(url);
          const result = await response.json();
          if (result.status === 'ok' && result.data) {
            setState((prev) => ({
              ...result.data,
              settings: {
                ...result.data.settings,
                googleScriptUrl: url,
                lastSyncedAt: result.updatedAt || new Date().toLocaleTimeString()
              }
            }));
            setSyncStatus('synced');
            showToast('Loaded latest data from Google Sheets Database!');
          } else if (result.status === 'empty') {
            setSyncStatus('idle');
            showToast('Google Sheet is empty. Click "Push / Save to Google Sheet" to initialize!', 'info');
          }
        } catch (err) {
          setSyncStatus('error');
          showToast('Failed to fetch from Google Sheets URL.', 'error');
        }
      };

      const updateStateAndSync = (updaterFn) => {
        setState((prev) => {
          const next = updaterFn(prev);
          if (next.settings.googleScriptUrl && next.settings.autoSyncGoogleSheet) {
            setTimeout(() => pushToGoogleSheets(next, true), 150);
          }
          return next;
        });
      };

      // ============================================================================
      // 7. HANDLERS FOR ALL 5 USER REQUIREMENTS
      // ============================================================================

      // 1. Open Create / Edit Trip Modal
      const openCreateTripModal = () => {
        setEditingTrip(null);
        setTripFormName('');
        setTripFormDest('');
        setTripFormStart('2026-11-01');
        setTripFormEnd('2026-11-05');
        setTripFormBudget('12000');
        setTripFormStatus('Ongoing');
        setTripFormMembers(state.members.map((m) => m.id));
        setTripModalOpen(true);
      };

      const openEditTripModal = (trip) => {
        setEditingTrip(trip);
        setTripFormName(trip.name);
        setTripFormDest(trip.destination);
        setTripFormStart(trip.startDate);
        setTripFormEnd(trip.endDate);
        setTripFormBudget(String(poishaToBdt(trip.expectedBudgetPoisha)));
        setTripFormStatus(trip.status || 'Ongoing');
        setTripFormMembers(trip.memberIds || state.members.map((m) => m.id));
        setTripModalOpen(true);
      };

      const handleSaveTripModal = (e) => {
        e.preventDefault();
        const name = tripFormName.trim();
        const dest = tripFormDest.trim();
        if (!name || !dest) {
          showToast('Please enter Trip Name and Destination!', 'error');
          return;
        }
        const memberIdsToSave = tripFormMembers.length > 0 ? tripFormMembers : state.members.map((m) => m.id);

        if (editingTrip) {
          const updatedTrip = {
            ...editingTrip,
            name,
            destination: dest,
            startDate: tripFormStart,
            endDate: tripFormEnd,
            expectedBudgetPoisha: bdtToPoisha(tripFormBudget || '0'),
            status: tripFormStatus,
            memberIds: memberIdsToSave
          };
          updateStateAndSync((prev) => ({
            ...prev,
            trips: prev.trips.map((t) => (t.id === editingTrip.id ? updatedTrip : t))
          }));
          showToast(`Updated trip "${name}"!`);
        } else {
          const newTrip = {
            id: `trip_${Date.now()}`,
            name,
            destination: dest,
            startDate: tripFormStart,
            endDate: tripFormEnd,
            description: '',
            memberIds: memberIdsToSave,
            expectedBudgetPoisha: bdtToPoisha(tripFormBudget || '0'),
            status: tripFormStatus,
            createdAt: new Date().toISOString()
          };
          updateStateAndSync((prev) => ({
            ...prev,
            trips: [newTrip, ...prev.trips]
          }));
          setDashboardScope(newTrip.id);
          setSelectedTripId(newTrip.id);
          showToast(`Created trip "${name}"!`);
        }
        setTripModalOpen(false);
        setEditingTrip(null);
      };

      const handleDeleteTrip = (trip) => {
        setConfirmDialog({
          title: `Delete Trip "${trip.name}"?`,
          description: `Are you sure you want to permanently delete "${trip.name}" and all its expenses and fund deposits?`,
          confirmLabel: 'Yes, Delete Trip',
          onConfirm: () => {
            updateStateAndSync((prev) => {
              const remainingTrips = prev.trips.filter((t) => t.id !== trip.id);
              const nextActiveId = remainingTrips[0]?.id || 'overall';
              setDashboardScope(nextActiveId);
              setSelectedTripId(remainingTrips[0]?.id || '');
              return {
                ...prev,
                trips: remainingTrips,
                expenses: prev.expenses.filter((e) => e.tripId !== trip.id),
                contributions: prev.contributions.filter((c) => c.tripId !== trip.id)
              };
            });
            setConfirmDialog(null);
            showToast(`Deleted trip "${trip.name}".`, 'info');
          }
        });
      };

      // 2. Open Add / Edit Member (Participant) Modal & Delete Member
      const openAddMemberModal = () => {
        setEditingMember(null);
        setMemberFormName('');
        setMemberFormContact('');
        setMemberFormRole('Member');
        setMemberModalOpen(true);
      };

      const openEditMemberModal = (member) => {
        setEditingMember(member);
        setMemberFormName(member.fullName);
        setMemberFormContact(member.phoneOrEmail || '');
        setMemberFormRole(member.role || 'Member');
        setMemberModalOpen(true);
      };

      const handleSaveMemberModal = (e) => {
        e.preventDefault();
        const cleanName = memberFormName.trim();
        if (!cleanName) {
          showToast('Please enter participant name!', 'error');
          return;
        }
        if (editingMember) {
          updateStateAndSync((prev) => ({
            ...prev,
            members: prev.members.map((m) =>
              m.id === editingMember.id
                ? { ...m, fullName: cleanName, phoneOrEmail: memberFormContact.trim(), role: memberFormRole }
                : m
            )
          }));
          showToast(`Renamed/updated participant "${cleanName}"!`);
        } else {
          const newId = `m_${Date.now()}`;
          const newM = {
            id: newId,
            fullName: cleanName,
            phoneOrEmail: memberFormContact.trim(),
            avatarColor: AVATAR_COLORS[state.members.length % AVATAR_COLORS.length],
            status: 'Active',
            role: memberFormRole,
            createdAt: new Date().toISOString()
          };
          updateStateAndSync((prev) => ({
            ...prev,
            members: [...prev.members, newM],
            trips: prev.trips.map((tr) => ({
              ...tr,
              memberIds: [...(tr.memberIds || []), newId]
            }))
          }));
          showToast(`Added participant "${cleanName}"!`);
        }
        setMemberModalOpen(false);
        setEditingMember(null);
      };

      // Inline quick add member from inside Add Expense
      const handleAddNewMemberInline = (nameStr, targetTripId) => {
        const cleanName = nameStr.trim();
        if (!cleanName) return null;
        const newId = `m_${Date.now()}`;
        const newM = {
          id: newId,
          fullName: cleanName,
          phoneOrEmail: '',
          avatarColor: AVATAR_COLORS[state.members.length % AVATAR_COLORS.length],
          status: 'Active',
          role: 'Member',
          createdAt: new Date().toISOString()
        };
        updateStateAndSync((prev) => ({
          ...prev,
          members: [...prev.members, newM],
          trips: prev.trips.map((tr) =>
            !targetTripId || tr.id === targetTripId
              ? { ...tr, memberIds: [...(tr.memberIds || []), newId] }
              : tr
          )
        }));
        showToast(`Added participant "${cleanName}"!`);
        return newId;
      };

      const handleDeleteMemberGlobal = (member) => {
        if (state.members.length <= 1) {
          showToast('At least 1 member must remain in the group!', 'error');
          return;
        }
        setConfirmDialog({
          title: `Delete Participant "${member.fullName}"?`,
          description: `Removing "${member.fullName}" will remove them from all trips and recalculate any shared expenses among the remaining participants.`,
          confirmLabel: 'Delete Participant',
          onConfirm: () => {
            updateStateAndSync((prev) => {
              const remainingMembers = prev.members.filter((m) => m.id !== member.id);
              const fallbackMemberId = remainingMembers[0]?.id || '';
              return {
                ...prev,
                members: remainingMembers,
                trips: prev.trips.map((tr) => ({
                  ...tr,
                  memberIds: (tr.memberIds || []).filter((id) => id !== member.id)
                })),
                contributions: prev.contributions.filter((c) => c.memberId !== member.id),
                expenses: prev.expenses
                  .map((ex) => {
                    const nextParticipants = (ex.participantIds || []).filter((id) => id !== member.id);
                    const finalParticipants =
                      nextParticipants.length > 0
                        ? nextParticipants
                        : fallbackMemberId
                        ? [fallbackMemberId]
                        : [];
                    return {
                      ...ex,
                      paidByMemberId:
                        ex.paidByMemberId === member.id ? fallbackMemberId : ex.paidByMemberId,
                      participantIds: finalParticipants,
                      allocations: calculateDeterministicSplit(ex.amountPoisha, finalParticipants)
                    };
                  })
              };
            });
            setConfirmDialog(null);
            showToast(`Deleted participant "${member.fullName}".`, 'info');
          }
        });
      };

      // 3. Deposit Fund (Add / Edit Contribution) Controlled Modal Handlers
      const openDepositModal = (defaultTId, contribToEdit = null) => {
        const targetTripId =
          contribToEdit?.tripId ||
          (defaultTId && defaultTId !== 'overall' ? defaultTId : state.trips[0]?.id) ||
          '';
        const targetTrip = state.trips.find((t) => t.id === targetTripId) || state.trips[0];
        const firstMemberId =
          contribToEdit?.memberId ||
          (targetTrip?.memberIds && targetTrip.memberIds[0]) ||
          state.members[0]?.id ||
          '';

        setEditingContribution(contribToEdit);
        setContribTripId(targetTrip?.id || '');
        setContribMemberId(firstMemberId);
        setContribAmountBdt(contribToEdit ? String(poishaToBdt(contribToEdit.amountPoisha)) : '');
        setContribMethod(contribToEdit?.paymentMethod || 'Cash');
        setContribRef(contribToEdit?.reference || '');
        setContribNote(contribToEdit?.note || '');
        setContribDateTime(contribToEdit?.dateTime || getCurrentDhakaDateTimeInput());
        setContributionModalOpen(true);
      };

      const handleSaveContributionModal = (e) => {
        e.preventDefault();
        const amtPoisha = bdtToPoisha(contribAmountBdt);
        if (!contribTripId) {
          showToast('Please select a trip first!', 'error');
          return;
        }
        if (!contribMemberId) {
          showToast('Please select a member!', 'error');
          return;
        }
        if (amtPoisha <= 0) {
          showToast('Deposit amount must be greater than 0 BDT!', 'error');
          return;
        }
        const memberObj = state.members.find((m) => m.id === contribMemberId);

        if (editingContribution) {
          const updatedC = {
            ...editingContribution,
            tripId: contribTripId,
            memberId: contribMemberId,
            amountPoisha: amtPoisha,
            paymentMethod: contribMethod,
            reference: contribRef.trim(),
            note: contribNote.trim(),
            dateTime: contribDateTime || getCurrentDhakaDateTimeInput()
          };
          updateStateAndSync((prev) => ({
            ...prev,
            contributions: prev.contributions.map((c) =>
              c.id === editingContribution.id ? updatedC : c
            )
          }));
          showToast(`Updated ${memberObj?.fullName}'s deposit to ${formatCurrency(amtPoisha, sym, true)}!`);
        } else {
          const newC = {
            id: `c_${Date.now()}`,
            tripId: contribTripId,
            memberId: contribMemberId,
            amountPoisha: amtPoisha,
            paymentMethod: contribMethod,
            reference: contribRef.trim(),
            note: contribNote.trim(),
            dateTime: contribDateTime || getCurrentDhakaDateTimeInput(),
            createdAt: new Date().toISOString()
          };
          updateStateAndSync((prev) => ({
            ...prev,
            contributions: [newC, ...prev.contributions]
          }));
          showToast(`Deposited ${formatCurrency(amtPoisha, sym, true)} from ${memberObj?.fullName}!`);
        }
        setContributionModalOpen(false);
        setEditingContribution(null);
      };

      // 4. Save Expense Handler
      const handleSaveExpenseRecord = (expRecord, isEdit) => {
        updateStateAndSync((prev) => ({
          ...prev,
          expenses: isEdit
            ? prev.expenses.map((ex) => (ex.id === expRecord.id ? expRecord : ex))
            : [expRecord, ...prev.expenses]
        }));
        setEditingExpense(null);
        setDashboardScope(expRecord.tripId);
        setSelectedTripId(expRecord.tripId);
        showToast(
          `${isEdit ? 'Updated' : 'Added'} expense "${expRecord.title}" (${formatCurrency(
            expRecord.amountPoisha,
            sym,
            true
          )})!`
        );
        setActiveNav('dashboard');
      };

      const handleDeleteExpense = (expense) => {
        setConfirmDialog({
          title: 'Delete Expense?',
          description: `Delete "${expense.title}" (${formatCurrency(expense.amountPoisha, sym, true)})? All member shares and balances will recalculate immediately.`,
          confirmLabel: 'Delete Expense',
          onConfirm: () => {
            updateStateAndSync((prev) => ({
              ...prev,
              expenses: prev.expenses.filter((e) => e.id !== expense.id)
            }));
            setConfirmDialog(null);
            showToast(`Deleted "${expense.title}".`, 'info');
          }
        });
      };

      const handleDeleteContribution = (contrib) => {
        const mName = state.members.find((m) => m.id === contrib.memberId)?.fullName || 'Member';
        setConfirmDialog({
          title: 'Delete Deposit?',
          description: `Delete ${mName}'s deposit of ${formatCurrency(contrib.amountPoisha, sym, true)}?`,
          confirmLabel: 'Delete Deposit',
          onConfirm: () => {
            updateStateAndSync((prev) => ({
              ...prev,
              contributions: prev.contributions.filter((c) => c.id !== contrib.id)
            }));
            setConfirmDialog(null);
            showToast('Deleted deposit.', 'info');
          }
        });
      };

      const t = I18N[state.settings.language || 'en'];
      const sym = state.settings.currencySymbol || '৳';

      const tripSummaries = useMemo(() => {
        const map = new Map();
        state.trips.forEach((trip) => {
          const tripContribs = state.contributions.filter((c) => c.tripId === trip.id);
          const tripExps = state.expenses.filter((e) => e.tripId === trip.id);
          map.set(trip.id, calculateTripFinancialSummary(trip, state.members, tripContribs, tripExps));
        });
        return map;
      }, [state.trips, state.members, state.contributions, state.expenses]);

      const overallMetrics = useMemo(() => {
        let totalCollectedPoisha = 0;
        let tripFundExpensesPoisha = 0;
        let personalExpensesPoisha = 0;
        let totalExpensesPoisha = 0;
        let remainingFundCashPoisha = 0;
        state.trips.forEach((trip) => {
          const s = tripSummaries.get(trip.id);
          if (!s) return;
          totalCollectedPoisha += s.totalCollectedPoisha;
          tripFundExpensesPoisha += s.tripFundExpensesPoisha;
          personalExpensesPoisha += s.personalExpensesPoisha;
          totalExpensesPoisha += s.totalExpensesPoisha;
          remainingFundCashPoisha += s.remainingFundCashPoisha;
        });
        return {
          totalCollectedPoisha,
          tripFundExpensesPoisha,
          personalExpensesPoisha,
          totalExpensesPoisha,
          remainingFundCashPoisha
        };
      }, [state.trips, tripSummaries]);

      const isOverall = dashboardScope === 'overall';
      const activeTrip = !isOverall
        ? state.trips.find((tr) => tr.id === dashboardScope) || state.trips[0]
        : state.trips.find((tr) => tr.id === selectedTripId) || state.trips[0];
      const activeSummary = activeTrip ? tripSummaries.get(activeTrip.id) : null;

      const totalCollected = isOverall ? overallMetrics.totalCollectedPoisha : activeSummary?.totalCollectedPoisha || 0;
      const tripFundSpent = isOverall ? overallMetrics.tripFundExpensesPoisha : activeSummary?.tripFundExpensesPoisha || 0;
      const personalSpent = isOverall ? overallMetrics.personalExpensesPoisha : activeSummary?.personalExpensesPoisha || 0;
      const totalExpenses = isOverall ? overallMetrics.totalExpensesPoisha : activeSummary?.totalExpensesPoisha || 0;
      const remainingCash = isOverall ? overallMetrics.remainingFundCashPoisha : activeSummary?.remainingFundCashPoisha || 0;

      const navItems = [
        { id: 'dashboard', icon: '📊', shortLabel: 'Home', label: t.dashboard },
        { id: 'trips', icon: '🗺️', shortLabel: 'My Trips', label: t.myTrips },
        { id: 'add_expense', icon: '➕', shortLabel: 'Add Expense', label: t.addExpense },
        { id: 'members', icon: '👥', shortLabel: 'Members', label: t.members },
        { id: 'reports', icon: '📥', shortLabel: 'Export', label: t.reportsExport },
        { id: 'google_sheets', icon: '🟢', shortLabel: 'Sheets DB', label: t.googleSheetsDb }
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* Desktop Sidebar */}
          <aside className="hidden md:flex md:w-64 bg-white border-r border-slate-200 p-4 flex-col justify-between shrink-0">
            <div>
              <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 text-white flex items-center justify-center shadow-sm shrink-0">
                    <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                      <circle cx="12" cy="14" r="2.5" fill="currentColor" />
                    </svg>
                  </div>
                  <div>
                    <h1 className="text-base font-extrabold text-slate-900 leading-none">{t.appName}</h1>
                    <span className="text-[11px] text-slate-500">{t.tagline}</span>
                  </div>
                </div>
                <button
                  onClick={() =>
                    setState((prev) => ({
                      ...prev,
                      settings: { ...prev.settings, language: prev.settings.language === 'en' ? 'bn' : 'en' }
                    }))
                  }
                  className="px-2.5 py-1 rounded-lg bg-slate-100 text-xs font-bold text-emerald-700"
                >
                  {state.settings.language === 'en' ? 'বাংলা' : 'EN'}
                </button>
              </div>

              <nav className="mt-4 flex flex-col gap-1">
                {navItems.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveNav(item.id)}
                    className={`px-3.5 py-2.5 rounded-xl text-xs font-bold text-left flex items-center gap-2.5 transition ${
                      activeNav === item.id
                        ? 'bg-emerald-600 text-white shadow-xs'
                        : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-[11px] space-y-1.5 mt-6">
              <div className="flex items-center justify-between font-bold text-slate-700">
                <span>Database Mode:</span>
                <span className="text-emerald-700">
                  {state.settings.googleScriptUrl ? 'Google Sheets + Local' : 'Local + Sheets Ready'}
                </span>
              </div>
              <p className="text-slate-500">Timezone: Asia/Dhaka (BST)</p>
              <button
                onClick={() => setActiveNav('google_sheets')}
                className="w-full mt-1 py-1.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 font-bold hover:bg-emerald-100"
              >
                Configure Google Sheet
              </button>
            </div>
          </aside>

          {/* Mobile Sticky Top Header */}
          <header className="md:hidden sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3.5 py-2.5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 text-white flex items-center justify-center shadow-xs shrink-0">
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">

                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {state.members.map((m) => (
                    <div
                      key={m.id}
                      className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 flex items-center justify-between gap-2"
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <div className={`w-10 h-10 rounded-xl ${m.avatarColor || 'bg-emerald-600'} text-white font-bold flex items-center justify-center shrink-0`}>
                          {m.fullName.charAt(0)}
                        </div>
                        <div className="truncate">
                          <p className="text-sm font-bold text-slate-900 truncate">{m.fullName}</p>
                          <p className="text-xs text-slate-500 truncate">{m.phoneOrEmail || m.role}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <button
                          onClick={() => openEditMemberModal(m)}
                          className="px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-100"
                        >
                          ✏️ Edit
                        </button>
                        <button
                          onClick={() => handleDeleteMemberGlobal(m)}
                          className="px-2.5 py-1.5 rounded-lg bg-white border border-red-200 text-xs font-bold text-red-600 hover:bg-red-50"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 5: REPORTS & EXPORT */}
            {activeNav === 'reports' && activeTrip && activeSummary && (
              <div className="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 space-y-5">
                <div>
                  <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-bold">
                    Complete A-to-Z Audit & Financial Export
                  </span>
                  <h2 className="text-lg sm:text-xl font-bold text-slate-900 mt-1">
                    Export Full A-to-Z Trip Report — {activeTrip.name}
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Includes every single detail: exact date &amp; time (kokhon), destination/place (kothay), payer &amp; participants (ke), exact amount &amp; individual shares (koto tk byay korlo), member-by-member passbook, and chronological cashbook ledger.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div>
                    <p className="font-bold text-slate-800 mb-1">📊 6 Worksheets Inside the Excel File:</p>
                    <ul className="space-y-1 text-slate-600 list-disc list-inside">
                      <li><strong>1. A-Z Trip Summary</strong> (Overview, Categories &amp; Member Matrix)</li>
                      <li><strong>2. Detailed Expenses (A-Z)</strong> (When, Where, Who Paid, Per-Member Share Columns)</li>
                      <li><strong>3. Fund Deposits</strong> (When, Who Deposited, Amount, Method &amp; Ref)</li>
                    </ul>
                  </div>
                  <div>
                    <p className="font-bold text-slate-800 mb-1">&nbsp;</p>
                    <ul className="space-y-1 text-slate-600 list-disc list-inside">
                      <li><strong>4. Member Passbook (A-Z)</strong> (Every Person&apos;s Individual Transaction History)</li>
                      <li><strong>5. Chronological Ledger</strong> (Time-Ordered Cash In/Out &amp; Running Balance)</li>
                      <li><strong>6. Final Settlement</strong> (Exact Who-Owes-Whom &amp; Fund Refunds)</li>
                    </ul>
                  </div>
                </div>

                <div className="flex flex-wrap gap-3">
                  <button
                    onClick={() => {
                      const xml = generateMultiSheetExcelXml(
                        activeTrip,
                        activeSummary,
                        state.expenses.filter((e) => e.tripId === activeTrip.id),
                        state.contributions.filter((c) => c.tripId === activeTrip.id),
                        state.members
                      );
                      triggerFileDownload(`${activeTrip.name.replace(/[^a-z0-9]/gi, '_')}_Full_AZ_Report.xls`, xml, 'application/vnd.ms-excel');
                      showToast('Downloaded Complete 6-Sheet A-to-Z Excel Workbook!');
                    }}
                    className="w-full sm:w-auto px-5 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold shadow-sm"
                  >
                    📥 Download Full 6-Sheet A-to-Z Excel Report (.xls)
                  </button>
                  <button
                    onClick={() => {
                      const csv = generateCompleteAzCsv(
                        activeTrip,
                        activeSummary,
                        state.expenses.filter((e) => e.tripId === activeTrip.id),
                        state.contributions.filter((c) => c.tripId === activeTrip.id),
                        state.members
                      );
                      triggerFileDownload(`${activeTrip.name.replace(/[^a-z0-9]/gi, '_')}_Full_AZ_Details.csv`, csv, 'text/csv;charset=utf-8;');
                      showToast('Downloaded Complete A-to-Z CSV Report!');
                    }}
                    className="w-full sm:w-auto px-5 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-bold"
                  >
                    📥 Download Complete A-to-Z Details (.csv)
                  </button>
                </div>
              </div>
            )}

            {/* VIEW 6: GOOGLE SHEETS DB */}
            {activeNav === 'google_sheets' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
                    <div>
                      <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-bold">
                        100% Free Serverless Cloud Database
                      </span>
                      <h2 className="text-lg sm:text-xl font-bold text-slate-900 mt-1">
                        Connect Google Sheets as Your Live TripMate Database
                      </h2>
                      <p className="text-xs text-slate-500">
                        Every trip, customized member, deposit, and expense syncs directly to your Google Sheet.
                      </p>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        onClick={() => pushToGoogleSheets(state, false)}
                        className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs"
                      >
                        ⬆️ Push to Google Sheet
                      </button>
                      <button
                        onClick={pullFromGoogleSheets}
                        className="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold"
                      >
                        ⬇️ Pull from Sheet
                      </button>
                    </div>
                  </div>

                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      updateStateAndSync((prev) => ({
                        ...prev,
                        settings: { ...prev.settings, googleScriptUrl: scriptUrlInput.trim() }
                      }));
                      showToast('Saved Google Apps Script Web App URL!');
                    }}
                    className="space-y-3"
                  >
                    <label className="block text-xs font-bold text-slate-700">
                      Your Google Apps Script Web App URL (ends with <code>/exec</code>)
                    </label>
                    <div className="flex flex-col sm:flex-row gap-2">
                      <input
                        type="url"
                        value={scriptUrlInput}
                        onChange={(e) => setScriptUrlInput(e.target.value)}
                        placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                        className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs font-mono"
                      />
                      <button
                        type="submit"
                        className="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold"
                      >
                        Save URL
                      </button>
                    </div>
                  </form>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-sm space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm sm:text-base font-bold text-slate-900">
                      Google Apps Script Code (Code.gs)
                    </h3>
                    <button
                      onClick={() => {
                        try {
                          navigator.clipboard.writeText(GOOGLE_APPS_SCRIPT_CODE);
                          showToast('Copied Code.gs to clipboard!');
                        } catch {
                          const ta = document.createElement('textarea');
                          ta.value = GOOGLE_APPS_SCRIPT_CODE;
                          document.body.appendChild(ta);
                          ta.select();
                          document.execCommand('copy');
                          document.body.removeChild(ta);
                          showToast('Copied Code.gs to clipboard!');
                        }
                      }}
                      className="px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
                    >
                      📋 Copy Code.gs
                    </button>
                  </div>
                  <pre className="p-3.5 rounded-xl bg-slate-900 text-emerald-300 text-[11px] font-mono overflow-x-auto max-h-60">
                    {GOOGLE_APPS_SCRIPT_CODE}
                  </pre>
                </div>
              </div>
            )}
          </main>

          {/* Mobile Sticky Bottom Navigation Bar (Optimized for Phone Use) */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 grid grid-cols-6 py-1 px-1 shadow-lg">
            {navItems.map((item) => {
              const active = activeNav === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveNav(item.id)}
                  className={`flex flex-col items-center justify-center py-1.5 rounded-xl transition ${
                    active ? 'text-emerald-700 font-extrabold bg-emerald-50' : 'text-slate-500 font-medium'
                  }`}
                >
                  <span className="text-base leading-none">{item.icon}</span>
                  <span className="text-[10px] mt-1 truncate max-w-full px-0.5">{item.shortLabel}</span>
                </button>
              );
            })}
          </nav>

          {/* MODAL 1: DEPOSIT FUND (RECORD / EDIT CONTRIBUTION) — CONTROLLED & RELIABLE */}
          {contributionModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 sm:p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-slate-900">
                    {editingContribution ? '✏️ Edit Fund Deposit' : '💰 Deposit Money to Trip Fund'}
                  </h3>
                  <button
                    type="button"
                    onClick={() => {
                      setContributionModalOpen(false);
                      setEditingContribution(null);
                    }}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveContributionModal} className="space-y-3.5 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Select Trip *</label>
                    <select
                      value={contribTripId}
                      onChange={(e) => setContribTripId(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-semibold"
                    >
                      {state.trips.map((tr) => (
                        <option key={tr.id} value={tr.id}>{tr.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Select Participant / Member *</label>
                    <select
                      value={contribMemberId}
                      onChange={(e) => setContribMemberId(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-semibold"
                    >
                      {state.members.map((m) => (
                        <option key={m.id} value={m.id}>{m.fullName}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Deposit Amount ({sym} BDT) *</label>
                    <input
                      type="number"
                      step="0.01"
                      min="0.01"
                      required
                      value={contribAmountBdt}
                      onChange={(e) => setContribAmountBdt(e.target.value)}
                      placeholder="e.g., 2000"
                      className="w-full p-3 border border-slate-300 rounded-xl text-base font-extrabold text-emerald-700"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">Payment Method</label>
                      <select
                        value={contribMethod}
                        onChange={(e) => setContribMethod(e.target.value)}
                        className="w-full p-2.5 border border-slate-300 rounded-xl bg-white"
                      >
                        <option value="Cash">Cash</option>
                        <option value="Mobile Banking">bKash / Nagad</option>
                        <option value="Bank">Bank Transfer</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">Date & Time</label>
                      <input
                        type="datetime-local"
                        value={contribDateTime}
                        onChange={(e) => setContribDateTime(e.target.value)}
                        className="w-full p-2.5 border border-slate-300 rounded-xl bg-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Reference / TrxID (Optional)</label>
                    <input
                      type="text"
                      value={contribRef}
                      onChange={(e) => setContribRef(e.target.value)}
                      placeholder="e.g., bKash TrxID or Cash note"
                      className="w-full p-2.5 border border-slate-300 rounded-xl"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => {
                        setContributionModalOpen(false);
                        setEditingContribution(null);
                      }}
                      className="px-4 py-2.5 border border-slate-300 rounded-xl font-bold text-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm"
                    >
                      {editingContribution ? 'Update Deposit' : '✅ Save Deposit'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: CREATE / EDIT TRIP — CONTROLLED & EDITABLE */}
          {tripModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 sm:p-6 space-y-4 shadow-2xl my-8">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-slate-900">
                    {editingTrip ? `✏️ Edit Trip: ${editingTrip.name}` : '🗺️ Create New Trip'}
                  </h3>
                  <button
                    type="button"
                    onClick={() => {
                      setTripModalOpen(false);
                      setEditingTrip(null);
                    }}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveTripModal} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Trip Name *</label>
                    <input
                      type="text"
                      required
                      value={tripFormName}
                      onChange={(e) => setTripFormName(e.target.value)}
                      placeholder="e.g., Sajek Valley Tour"
                      className="w-full p-2.5 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Destination *</label>
                    <input
                      type="text"
                      required
                      value={tripFormDest}
                      onChange={(e) => setTripFormDest(e.target.value)}
                      placeholder="e.g., Rangamati"
                      className="w-full p-2.5 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">Start Date</label>
                      <input
                        type="date"
                        value={tripFormStart}
                        onChange={(e) => setTripFormStart(e.target.value)}
                        className="w-full p-2.5 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">End Date</label>
                      <input
                        type="date"
                        value={tripFormEnd}
                        onChange={(e) => setTripFormEnd(e.target.value)}
                        className="w-full p-2.5 border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">Expected Budget (BDT)</label>
                      <input
                        type="number"
                        value={tripFormBudget}
                        onChange={(e) => setTripFormBudget(e.target.value)}
                        className="w-full p-2.5 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">Status</label>
                      <select
                        value={tripFormStatus}
                        onChange={(e) => setTripFormStatus(e.target.value)}
                        className="w-full p-2.5 border border-slate-300 rounded-xl bg-white"
                      >
                        <option value="Planned">Planned</option>
                        <option value="Ongoing">Ongoing</option>
                        <option value="Completed">Completed</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-700">
                      Trip Participants ({tripFormMembers.length} selected)
                    </label>
                    <div className="grid grid-cols-2 gap-1.5 max-h-36 overflow-y-auto p-2 border border-slate-200 rounded-xl bg-slate-50">
                      {state.members.map((m) => {
                        const checked = tripFormMembers.includes(m.id);
                        return (
                          <button
                            type="button"
                            key={m.id}
                            onClick={() =>
                              setTripFormMembers((prev) =>
                                prev.includes(m.id) ? prev.filter((id) => id !== m.id) : [...prev, m.id]
                              )
                            }
                            className={`p-2 rounded-lg text-left font-bold truncate ${
                              checked ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border'
                            }`}
                          >
                            {checked ? '✓ ' : '+ '} {m.fullName}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => {
                        setTripModalOpen(false);
                        setEditingTrip(null);
                      }}
                      className="px-4 py-2.5 border border-slate-300 rounded-xl font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-bold"
                    >
                      {editingTrip ? 'Save Trip Changes' : 'Create Trip'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: ADD / EDIT PARTICIPANT NAME — CONTROLLED */}
          {memberModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 sm:p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-slate-900">
                    {editingMember ? `✏️ Edit Participant: ${editingMember.fullName}` : '👤 Add New Participant'}
                  </h3>
                  <button
                    type="button"
                    onClick={() => {
                      setMemberModalOpen(false);
                      setEditingMember(null);
                    }}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveMemberModal} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Participant Full Name *</label>
                    <input
                      type="text"
                      required
                      value={memberFormName}
                      onChange={(e) => setMemberFormName(e.target.value)}
                      placeholder="e.g., Tanvir Ahmed"
                      className="w-full p-2.5 border border-slate-300 rounded-xl text-sm font-bold"
                    />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Phone / Email (Optional)</label>
                    <input
                      type="text"
                      value={memberFormContact}
                      onChange={(e) => setMemberFormContact(e.target.value)}
                      placeholder="+8801..."
                      className="w-full p-2.5 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-700">Role</label>
                    <select
                      value={memberFormRole}
                      onChange={(e) => setMemberFormRole(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white"
                    >
                      <option value="Organizer">Organizer</option>
                      <option value="Member">Member</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => {
                        setMemberModalOpen(false);
                        setEditingMember(null);
                      }}
                      className="px-4 py-2.5 border border-slate-300 rounded-xl font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-bold"
                    >
                      {editingMember ? 'Save Name' : 'Add Participant'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Confirmation Dialog */}
          {confirmDialog && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-900">{confirmDialog.title}</h3>
                <p className="text-xs text-slate-600 leading-relaxed">{confirmDialog.description}</p>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setConfirmDialog(null)}
                    className="px-4 py-2 border border-slate-300 rounded-xl text-xs font-bold"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDialog.onConfirm}
                    className="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-bold"
                  >
                    {confirmDialog.confirmLabel}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
