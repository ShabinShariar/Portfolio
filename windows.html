<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Activation Code</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: #00ff99;
      font-family: "Courier New", monospace;
      overflow: hidden;
    }

    /* Matrix Canvas */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .container {
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 10px #00ff99;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .box {
      margin-top: 30px;
      display: inline-block;
      padding: 20px;
      border: 1px solid #00ff99;
      border-radius: 10px;
      box-shadow: 0 0 15px #00ff99;
    }

    .code {
      margin: 10px 0;
      font-size: 1.1rem;
      letter-spacing: 2px;
    }

    a {
      display: inline-block;
      margin-top: 30px;
      color: black;
      background: #00ff99;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
    }

    a:hover {
      background: #00cc77;
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
  <h1>⚡ ACCESS GRANTED ⚡</h1>
  <p>Windows Activation Panel</p>

  <div class="box">
    <div class="code">Search Windows PowerShell → right-click → Run as Administrator. </div>
    <div class="code">Paste this link</div>
    <div class="code">irm https://get.activated.win | iex</div>
  </div>

  <br>
  <a href="index.html">⬅ Back to Home</a>
</div>

<script>
  // Matrix effect
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;

  const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const fontSize = 14;
  const columns = canvas.width / fontSize;

  const drops = [];
  for (let x = 0; x < columns; x++) {
    drops[x] = 1;
  }

  function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff99";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = letters.charAt(Math.floor(Math.random() * letters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }

      drops[i]++;
    }
  }

  setInterval(draw, 35);
</script>

</body>
</html>
