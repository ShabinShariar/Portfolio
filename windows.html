<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Activation Panel</title>

  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      padding-top: 12vh; /* বক্সটিকে একটু উপরে তোলার জন্য */
      background: #000;
      color: #00ff99;
      font-family: 'Fira Code', monospace;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* সেন্টার থেকে সরিয়ে উপরে নেওয়া হয়েছে */
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* Matrix Canvas */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      opacity: 0.9;
    }

    .container {
      text-align: center;
      z-index: 1;
      width: 90%;
      max-width: 650px;
    }

    /* Animated Glowing Text */
    h1 {
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      margin-top: 0;
      animation: neon-glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes neon-glow {
      from { text-shadow: 0 0 5px #00ff99, 0 0 10px #00ff99; }
      to { text-shadow: 0 0 20px #00ff99, 0 0 30px #00ff99, 0 0 40px #00cc77; }
    }

    p {
      font-size: 1.1rem;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    /* Terminal Window Style */
    .terminal-box {
      background: rgba(10, 20, 15, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 153, 0.3);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 255, 153, 0.15);
      overflow: hidden;
      text-align: left;
    }

    /* Terminal Header */
    .terminal-header {
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 153, 0.2);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .terminal-title {
      color: #888;
      font-size: 0.9rem;
      margin-left: 10px;
    }

    /* Terminal Body */
    .terminal-body {
      padding: 20px;
    }

    .step {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    
    .step span {
      color: #00ff99;
      font-weight: bold;
    }

    /* Code & Copy Button Row */
    .command-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #00ff99;
      border-radius: 6px;
      padding: 10px 15px;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .code-text {
      font-size: 1rem;
      color: #fff;
      word-break: break-all;
    }

    .copy-btn {
      background: transparent;
      color: #00ff99;
      border: 1px solid #00ff99;
      padding: 8px 15px;
      font-family: 'Fira Code', monospace;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #00ff99;
      color: black;
      box-shadow: 0 0 10px #00ff99;
    }

    /* Back Button */
    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #00ff99;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.3s;
      border-bottom: 1px dashed transparent;
    }

    .back-link:hover {
      color: #fff;
      border-bottom: 1px dashed #fff;
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
  <h1>⚡ ACCESS GRANTED ⚡</h1>
  <p>Windows Activation Security Panel</p>

  <div class="terminal-box">
    <div class="terminal-header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="terminal-title">root@windows:~</div>
    </div>
    
    <div class="terminal-body">
      <div class="step">
        > Search <span>Windows PowerShell</span><br>
        > Right-click and select <span>Run as Administrator</span><br>
        > Paste the following command and hit Enter:
      </div>

      <div class="command-row">
        <div class="code-text" id="activationCode">irm https://get.activated.win | iex</div>
        <button class="copy-btn" onclick="copyText()">
          <span id="btnIcon">📋</span> <span id="btnText">Copy</span>
        </button>
      </div>
    </div>
  </div>

  <a href="index.html" class="back-link">⬅ Return to Home</a>
</div>

<script>
  // Advanced Copy to clipboard function
  function copyText() {
    const textToCopy = document.getElementById("activationCode").innerText;
    const btn = document.querySelector(".copy-btn");
    const btnText = document.getElementById("btnText");
    const btnIcon = document.getElementById("btnIcon");
    
    navigator.clipboard.writeText(textToCopy).then(() => {
      btn.style.background = "#00ff99";
      btn.style.color = "black";
      btnIcon.innerText = "✔";
      btnText.innerText = "Copied";
      
      setTimeout(() => {
        btn.style.background = "transparent";
        btn.style.color = "#00ff99";
        btnIcon.innerText = "📋";
        btnText.innerText = "Copy";
      }, 2500);
    });
  }

  // Original Dense Matrix Effect
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;

  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
  const fontSize = 14; // ফন্ট সাইজ কমিয়ে কলাম বাড়ানো হয়েছে (ঘনত্বের জন্য)
  const columns = canvas.width / fontSize;

  const drops = [];
  for (let x = 0; x < columns; x++) {
    drops[x] = 1;
  }

  function draw() {
    // আগের মতো 0.05 অপাসিটি ব্যবহার করা হয়েছে যাতে লেজ (tail) লম্বা হয় এবং ঘন লাগে
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff99";
    ctx.font = "bold " + fontSize + "px monospace"; // ফন্ট বোল্ড করা হয়েছে

    for (let i = 0; i < drops.length; i++) {
      const text = letters.charAt(Math.floor(Math.random() * letters.length));
      
      // গ্লো ইফেক্ট
      ctx.shadowBlur = 3;
      ctx.shadowColor = "#00ff99";
      
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      
      ctx.shadowBlur = 0;

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  window.addEventListener('resize', () => {
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
  });

  // স্পিড একটু কমিয়ে দেওয়া হয়েছে যাতে সুন্দরভাবে বোঝা যায়
  setInterval(draw, 35);
</script>

</body>
</html>
