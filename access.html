<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Terminal</title>

<style>
body {
  margin:0;
  background:black;
  color:#00ff99;
  font-family:"Courier New", monospace;
  overflow: hidden; /* স্ক্রলবার লুকানোর জন্য */
}

#terminal {
  padding:20px;
  white-space:pre-wrap;
}

input {
  background:transparent;
  border:none;
  color:#00ff99;
  outline:none;
  font-family:inherit;
}

.glow {
  text-shadow:0 0 5px #00ff99,0 0 10px #00ff99,0 0 20px #00ff99;
}

.code {
  cursor:pointer;
}

.code:hover {
  color:#fff;
}

.copy-msg {
  color:yellow;
  font-size:0.9rem;
}

/* শুরুর ক্লিকের স্ক্রিন স্টাইল */
#startScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  cursor: pointer;
}

#startScreen h2 {
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
</style>
</head>

<body>

<!-- শুরুতে ক্লিক করার জন্য স্ক্রিন -->
<div id="startScreen" class="glow">
  <h2>[ CLICK ANYWHERE TO INITIALIZE SYSTEM ]</h2>
</div>

<div id="terminal" class="glow"></div>

<!-- আপনার লোকাল অডিও ফাইলগুলো -->
<audio id="hackSound" src="typing.mp3"></audio>
<audio id="keyPressSound" src="typing.mp3"></audio>
<audio id="successSound" src="success.mp3"></audio>
<audio id="errorSound" src="error.mp3"></audio>
<audio id="startupSound" src="audios/async function start audio.mp3"></audio>

<script>
const terminal = document.getElementById("terminal");
const sound = document.getElementById("hackSound");
const keySound = document.getElementById("keyPressSound");
const successSound = document.getElementById("successSound");
const errorSound = document.getElementById("errorSound");
const startupSound = document.getElementById("startupSound");

const startScreen = document.getElementById("startScreen");

const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));

async function typeText(text) {
  for (let char of text) {
    terminal.innerHTML += char;
    sound.currentTime = 0;
    sound.play().catch(()=>{});
    await sleep(20);
  }
  terminal.innerHTML += "\n";
}

async function start() {
  // লেখা শুরু হওয়ার সাথে সাথে এই সাউন্ডটি বাজবে
  startupSound.currentTime = 0;
  startupSound.play().catch(()=>{});

  await typeText("Initializing system...");
  await typeText("Connecting to secure server...");
  await typeText("Bypassing firewall...");
  await typeText("Establishing secure SSH connection...");
  await typeText("Routing IP: Tokyo -> Berlin -> Ashulia...");
  await typeText("Loading 'Think_Outside_The_Box' framework...");
  await typeText("Decrypting RSA-2048 keys...");
  await typeText("Connecting to secure server...");
  await typeText("Bypassing firewall...");
  await typeText("Overriding mainframe protocol...");
  await typeText("ACCESS GRANTED ✅\n");

  await typeText("Enter Username:");
  inputField("username");
}

function inputField(type) {
  const input = document.createElement("input");
  
  if(type === "password") {
      input.type = "password"; 
  }
  
  terminal.appendChild(input);
  input.focus();

  input.addEventListener("keydown", function(e){
    if(e.key !== "Enter"){
        keySound.currentTime = 0;
        keySound.play().catch(()=>{});
    }

    if(e.key==="Enter"){
      terminal.innerHTML += (type === "password" ? "*".repeat(input.value.length) : input.value) + "\n";
      input.remove();

      if(type==="username"){
        askPassword();
      } else if(type==="password"){
        checkPassword(input.value);
      } else if(type==="command"){
        fakeAI(input.value);
      }
    }
  });
}

function askPassword(){
  terminal.innerHTML += "Enter Password:\n";
  inputField("password");
}

async function checkPassword(pass){
  if(pass==="shabin"){
    successSound.currentTime = 0;
    successSound.play().catch(()=>{});
    
    await typeText("Authenticating...");
    await typeText("Login Successful 🔓");

    setTimeout(()=>{
      window.location.href = "windows.html"; 
    },1500);

  } else {
    errorSound.currentTime = 0;
    errorSound.play().catch(()=>{});

    await typeText("❌ Access Denied");
    askPassword();
  }
}

// যখন ইউজার স্ক্রিনে ক্লিক করবে, তখন startScreen হাইড হবে এবং start() ফাংশন রান করবে
startScreen.addEventListener("click", () => {
  startScreen.style.display = "none";
  start();
});

</script>

</body>
</html>
