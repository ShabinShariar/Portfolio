<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Terminal</title>

<style>
body {
  margin:0;
  background:black;
  color:#00ff99;
  font-family:"Courier New", monospace;
}

#terminal {
  padding:20px;
  white-space:pre-wrap;
}

input {
  background:transparent;
  border:none;
  color:#00ff99;
  outline:none;
  font-family:inherit;
}

.glow {
  text-shadow:0 0 5px #00ff99,0 0 10px #00ff99,0 0 20px #00ff99;
}

.code {
  cursor:pointer;
}

.code:hover {
  color:#fff;
}

.copy-msg {
  color:yellow;
  font-size:0.9rem;
}

</style>
</head>

<body>

<div id="terminal" class="glow"></div>

<!-- আপনার লোকাল অডিও ফাইলগুলো এখানে অ্যাড করা হলো -->
<audio id="hackSound" src="typing.mp3"></audio>
<audio id="keyPressSound" src="typing.mp3"></audio>
<audio id="successSound" src="success.mp3"></audio>
<audio id="errorSound" src="error.mp3"></audio>
<!-- নতুন স্টার্টআপ সাউন্ড অ্যাড করা হলো -->
<audio id="startupSound" src="async function start audio.mp3"></audio>

<script>
const terminal = document.getElementById("terminal");
const sound = document.getElementById("hackSound");
const keySound = document.getElementById("keyPressSound");
const successSound = document.getElementById("successSound");
const errorSound = document.getElementById("errorSound");
// নতুন স্টার্টআপ সাউন্ডটি জাভাস্ক্রিপ্টে নেওয়া হলো
const startupSound = document.getElementById("startupSound");

const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));

async function typeText(text) {
  for (let char of text) {
    terminal.innerHTML += char;
    sound.currentTime = 0;
    sound.play().catch(()=>{});
    await sleep(20);
  }
  terminal.innerHTML += "\n";
}

async function start() {
  // লেখা শুরু হওয়ার সাথে সাথে এই সাউন্ডটি বাজবে
  startupSound.currentTime = 0;
  startupSound.play().catch(()=>{});

  await typeText("Initializing system...");
  await typeText("Connecting to secure server...");
  await typeText("Bypassing firewall...");
  await typeText("Establishing secure SSH connection...");
  await typeText("Routing IP: Tokyo -> Berlin -> Ashulia...");
  await typeText("Loading 'Think_Outside_The_Box' framework...");
  await typeText("Decrypting RSA-2048 keys...");
  await typeText("Connecting to secure server...");
  await typeText("Bypassing firewall...");
  await typeText("Overriding mainframe protocol...");
  await typeText("ACCESS GRANTED ✅\n");

  await typeText("Enter Username:");
  inputField("username");
}

function inputField(type) {
  const input = document.createElement("input");
  
  // পাসওয়ার্ড লেখার সময় যেন * দেখায়
  if(type === "password") {
      input.type = "password"; 
  }
  
  terminal.appendChild(input);
  input.focus();

  input.addEventListener("keydown", function(e){
    // কীবোর্ডে কিছু টাইপ করলেই typing.mp3 বাজবে
    if(e.key !== "Enter"){
        keySound.currentTime = 0;
        keySound.play().catch(()=>{});
    }

    if(e.key==="Enter"){
      terminal.innerHTML += (type === "password" ? "*".repeat(input.value.length) : input.value) + "\n";
      input.remove();

      if(type==="username"){
        askPassword();
      } else if(type==="password"){
        checkPassword(input.value);
      } else if(type==="command"){
        fakeAI(input.value);
      }
    }
  });
}

function askPassword(){
  terminal.innerHTML += "Enter Password:\n";
  inputField("password");
}

async function checkPassword(pass){
  if(pass==="shabin"){
    // পাসওয়ার্ড সঠিক হলে success.mp3 বাজবে
    successSound.currentTime = 0;
    successSound.play().catch(()=>{});
    
    await typeText("Authenticating...");
    await typeText("Login Successful 🔓");

    setTimeout(()=>{
      window.location.href = "windows.html"; 
    },1500);

  } else {
    // পাসওয়ার্ড ভুল হলে error.mp3 বাজবে
    errorSound.currentTime = 0;
    errorSound.play().catch(()=>{});

    await typeText("❌ Access Denied");
    askPassword();
  }
}

function showCodes(){
  const codes = [
    "XXXXX-XXXXX-XXXXX-XXXXX",
    "XXXXX-XXXXX-XXXXX-XXXXX",
    "XXXXX-XXXXX-XXXXX-XXXXX"
  ];

  codes.forEach(code=>{
    const div = document.createElement("div");
    div.className="code";
    div.textContent = code;

    div.onclick = ()=>{
      navigator.clipboard.writeText(code);
      const msg = document.createElement("div");
      msg.className="copy-msg";
      msg.textContent="Copied!";
      terminal.appendChild(msg);
      setTimeout(()=>msg.remove(),1000);
    };

    terminal.appendChild(div);
  });
}

async function fakeAI(cmd){
  await typeText("Processing command: " + cmd);

  if(cmd.toLowerCase().includes("help")){
    await typeText("Available commands: help, status, clear");
  }
  else if(cmd.toLowerCase().includes("status")){
    await typeText("System running нормально ⚡");
  }
  else if(cmd.toLowerCase().includes("clear")){
    terminal.innerHTML="";
  }
  else{
    await typeText("Unknown command...");
  }

  inputField("command");
}

start();
</script>

</body>
</html>
