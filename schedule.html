<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Schedule</title>
<style>
  /* ডিফল্ট ভেরিয়েবল এবং গ্লাসমরফিজম ডিজাইন */
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins", sans-serif; }
  :root {
    --bg-color: #f8fafc; --text-color: #475569; --heading-color: #0f172a;
    --card-bg: rgba(255, 255, 255, 0.7); --border-color: rgba(226, 232, 240, 0.6);
    --primary-color: #2563eb; --shadow-light: rgba(0,0,0,0.03);
  }
  body.dark-theme {
    --bg-color: #0f172a; --text-color: #cbd5e1; --heading-color: #f8fafc;
    --card-bg: rgba(30, 41, 59, 0.7); --border-color: rgba(51, 65, 85, 0.6);
    --primary-color: #38bdf8;
  }
  body { 
    background: var(--bg-color); color: var(--text-color); 
    padding: 2rem 5%; transition: background 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
  }
  
  /* হেডার ডিজাইন - পিসির জন্য সেন্টার এলাইন করা হয়েছে */
  .header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin: 0 auto 1.5rem auto; 
    max-width: 800px; /* কার্ডের সাইজের সাথে মিলানো হয়েছে */
    width: 100%;
  }
  .back-btn { text-decoration: none; background: var(--primary-color); color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); transition: 0.3s;}
  .back-btn:hover { transform: translateY(-2px); }
  .day-title { font-size: 1.5rem; color: var(--heading-color); text-align: center; margin-bottom: 1rem; font-weight: 700; }
  
  /* ক্যালেন্ডার নেভিগেশন - পিসিতে সেন্টার এবং মোবাইলে সোয়াইপ */
  .days-nav { 
    display: flex; 
    gap: 12px; 
    margin: 0 auto 2rem auto; 
    max-width: 800px; /* কার্ডের সাইজের সাথে মিলানো হয়েছে */
    width: 100%;
    overflow-x: auto; 
    padding-bottom: 15px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  /* স্ক্রলবার লুকানোর জন্য */
  .days-nav::-webkit-scrollbar { display: none; }
  .days-nav { -ms-overflow-style: none; scrollbar-width: none; }

  /* পিসি বা বড় স্ক্রিনের জন্য স্পেশাল এলাইনমেন্ট */
  @media (min-width: 768px) {
    .days-nav {
      justify-content: center; /* পিসিতে বাটনগুলো একদম মাঝখানে থাকবে */
      overflow-x: visible;
    }
  }

  .day-btn { 
    flex: 0 0 auto; 
    background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); 
    padding: 10px 18px; border-radius: 14px; cursor: pointer; transition: all 0.3s ease; 
    text-align: center; min-width: 80px; box-shadow: 0 2px 8px var(--shadow-light);
  }
  .day-btn:hover { background: rgba(37, 99, 235, 0.05); transform: translateY(-2px); }
  .day-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); transform: scale(1.05); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3); }
  .day-btn strong { display: block; font-size: 0.85rem; margin-bottom: 2px; opacity: 0.9;}
  .day-btn span { font-size: 1.3rem; font-weight: 700; }

  /* ক্লাস কার্ডের কন্টেইনার */
  .schedule-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; width: 100%; }
  
  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .class-card {
    background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 20px; border-radius: 18px; border: 1px solid var(--border-color);
    box-shadow: 0 6px 15px var(--shadow-light); display: flex; justify-content: space-between; align-items: center;
    transition: all 0.3s ease;
    animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0; 
  }
  .class-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px var(--shadow-light); border-color: var(--primary-color); }
  
  /* এক্সট্রা ক্লাসের ডিজাইন */
  .class-card.extra-class { border: 2px solid var(--primary-color); background: linear-gradient(145deg, var(--card-bg), rgba(37, 99, 235, 0.05)); }
  .extra-badge { color: #fff; background: var(--primary-color); font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; margin-left: 10px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);}

  .class-info h3 { color: var(--heading-color); margin-bottom: 8px; display: flex; align-items: center; flex-wrap: wrap; font-size: 1.15rem; line-height: 1.4;}
  .class-info p { font-size: 0.95rem; display: flex; align-items: center; gap: 5px; opacity: 0.8;}
  .class-time { text-align: right; min-width: 140px; }
  .class-time .time { font-weight: 700; color: var(--primary-color); font-size: 1.1rem; margin-bottom: 3px;}
  .class-time .duration { font-size: 0.85rem; opacity: 0.7; font-weight: 500;}
  
  .no-class { text-align: center; padding: 3rem 1rem; font-size: 1.2rem; color: var(--text-color); background: var(--card-bg); border-radius: 18px; border: 1px dashed var(--border-color); animation: slideUpFade 0.5s forwards;}

  /* মোবাইলের জন্য রেসপন্সিভ ডিজাইন */
  @media (max-width: 767px) {
    body { padding: 1.5rem 1rem; }
    .header { margin-bottom: 1rem; }
    .day-title { font-size: 1.3rem; margin-bottom: 0.5rem;}
    .class-card { flex-direction: column; align-items: flex-start; gap: 15px; padding: 18px; }
    .class-time { text-align: left; background: rgba(37, 99, 235, 0.05); padding: 10px 15px; border-radius: 12px; width: 100%; border-left: 3px solid var(--primary-color);}
    .class-info h3 { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn">← Back</a>
  <h2 class="day-title" id="currentDayTitle">Loading...</h2>
  <div style="width: 70px;"></div> 
</div>

<div class="days-nav" id="daysNav"></div>

<div class="schedule-container" id="scheduleContainer"></div>

<script>
  // থিম ট্র্যাকিং
  if (localStorage.getItem('portfolioTheme') === 'dark') {
    document.body.classList.add('dark-theme');
  }

  // ফিক্সড রুটিন ডেটা
  const weeklySchedule = {
    "Saturday": [
      { subject: "Textile Wet Processing I", time: "8:20 AM - 09:50 AM", duration: "1.5 Hours", room: "📍 Room: E-202" },
      { subject: "Art of Living and Engineering Ethics", time: "11:20 AM - 12:50 PM", duration: "1.5 Hours", room: "📍 Room: DB-301" },
      { subject: "Industrial Management", time: "01:10 PM - 02:40 PM", duration: "1.5 Hours", room: "📍 Room: E-202" }
    ],
    "Sunday": [
      { subject: "Apparel Manufacturing I", time: "09:50 AM - 11:20 AM", duration: "1.5 Hours", room: "📍 Room: DB-302" },
      { subject: "Art of Living and Engineering Ethics", time: "11:20 AM - 12:50 PM", duration: "1.5 Hours", room: "📍 Room: DB-302" }
    ],
    "Monday": [
      { subject: "Apparel Manufacturing I", time: "11:20 AM - 12:50 PM", duration: "1.5 Hours", room: "📍 Room: DB-301" }
    ],
    "Tuesday": [
      { subject: "Textile Wet Processing I", time: "8:20 AM - 09:50 AM", duration: "1.5 Hours", room: "📍 Room: E-202" },
      { subject: "Industrial Management", time: "11:20 AM - 12:50 PM", duration: "1.5 Hours", room: "📍 Room: E-202" }
    ],
    "Wednesday": [
      { subject: "Apparel Manufacturing I Sessional", time: "08:20 AM - 11:20 AM", duration: "3 Hours", room: "📍 Room: Apparel Lab" },
      { subject: "Apparel Manufacturing I Sessional", time: "11:20 AM - 12:20 PM", duration: "1 Hour", room: "📍 Room: Apparel Lab" }
    ],
    "Thursday": [], 
    "Friday": [] 
  };

  // এক্সট্রা ক্লাস (শনিবারের জন্য উদাহরণ হিসেবে রাখা হলো)
  const extraClasses = {
    "2026-07-11": [
      { subject: "Special Quiz / Lab Class", time: "02:00 PM - 04:00 PM", duration: "2 Hours", room: "📍 Room: G15", isExtra: true }
    ]
  };

  const daysOfWeekFull = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const daysOfWeekShort = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  
  let displayDates = [];
  const todayDateObj = new Date();
  
  for(let i = -3; i <= 3; i++) {
     let d = new Date();
     d.setDate(todayDateObj.getDate() + i);
     displayDates.push(d);
  }

  function getFormattedDateString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
  }

  function renderSchedule(dateObj) {
    const dayNameFull = daysOfWeekFull[dateObj.getDay()];
    const dateString = getFormattedDateString(dateObj);
    
    const displayDateTitle = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById("currentDayTitle").innerText = displayDateTitle;
    
    const container = document.getElementById("scheduleContainer");
    container.innerHTML = ""; 
    
    const regularClasses = weeklySchedule[dayNameFull] || [];
    const specialClasses = extraClasses[dateString] || [];
    const allClasses = [...regularClasses, ...specialClasses];

    if (allClasses.length === 0) {
      container.innerHTML = `<div class="no-class">🎉 No classes on this day!<br><span style="font-size:0.9rem; opacity:0.7;">Enjoy your free time.</span></div>`;
      return;
    }

    allClasses.forEach((cls, index) => {
      const card = document.createElement("div");
      card.className = `class-card ${cls.isExtra ? 'extra-class' : ''}`;
      card.style.animationDelay = `${index * 0.1}s`;
      
      const extraBadgeHTML = cls.isExtra ? `<span class="extra-badge">Extra</span>` : '';

      card.innerHTML = `
        <div class="class-info">
          <h3>${cls.subject} ${extraBadgeHTML}</h3>
          <p>${cls.room}</p>
        </div>
        <div class="class-time">
          <div class="time">🕒 ${cls.time}</div>
          <div class="duration">⏳ ${cls.duration}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function setupDaysNav() {
    const navContainer = document.getElementById("daysNav");
    const todayStr = getFormattedDateString(todayDateObj);
    
    displayDates.forEach((dateObj) => {
      const btn = document.createElement("button");
      const currentLoopDateStr = getFormattedDateString(dateObj);
      const isToday = currentLoopDateStr === todayStr;
      
      if(isToday) {
         btn.className = "day-btn active";
         setTimeout(() => {
           btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
         }, 100);
      } else {
         btn.className = "day-btn";
      }
      
      const dayNameShort = isToday ? "Today" : daysOfWeekShort[dateObj.getDay()];
      const dateNum = dateObj.getDate();
      
      btn.innerHTML = `<strong>${dayNameShort}</strong><span>${dateNum}</span>`;
      
      btn.onclick = () => {
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        renderSchedule(dateObj);
      };
      
      navContainer.appendChild(btn);
    });
  }

  setupDaysNav();
  renderSchedule(todayDateObj); 
</script>
</body>
</html>
