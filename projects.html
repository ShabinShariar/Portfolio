<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🖥️</text></svg>">
  <title>Projects - shabin shariar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    /* =========================================
       CSS Variables for Light & Dark Mode
    ========================================= */
    :root {
      --bg-color: #f8fafc;
      --text-color: #475569;
      --heading-color: #0f172a;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --shadow-light: rgba(0,0,0,0.03);
      --shadow-strong: rgba(0,0,0,0.08);
    }

    body.dark-theme {
      --bg-color: #0f172a;
      --text-color: #cbd5e1;
      --heading-color: #f8fafc;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary-color: #38bdf8;
      --primary-hover: #f8fafc;
      --shadow-light: rgba(0,0,0,0.5);
      --shadow-strong: rgba(56, 189, 248, 0.15);
    }

    body {
      background: var(--bg-color);
      padding: 2rem 5%;
      transition: background 0.4s ease, color 0.4s ease;
    }

    h1 {
      text-align: center;
      color: var(--heading-color);
      margin-bottom: 2rem;
      transition: color 0.4s ease;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem; /* slightly smaller gap */
    }

    @media (max-width: 900px) {
      .project-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .project-grid {
        grid-template-columns: 1fr;
      }
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.2rem; /* even smaller padding */
      box-shadow: 0 4px 10px var(--shadow-light);
      transition: all 0.3s ease;
      cursor: pointer;
      max-width: 360px; /* smaller width */
      margin: auto;
      width: 100%; /* Ensures it fills the grid cell up to max-width */
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary-color);
      box-shadow: 0 15px 30px var(--shadow-strong);
    }

    .project-card img {
      width: 100%;
      border-radius: 8px;
      height: 250px; /* smaller height */
      object-fit: contain;
      transition: transform 0.4s ease;
    }
    
    .project-card:hover img {
      transform: scale(1.03); /* Subtle zoom effect */
    }

    .back-btn {
      display: inline-block;
      margin-top: 3rem;
      background: var(--primary-color);
      color: #ffffff;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px var(--shadow-strong); 
    }

    /* Dark mode button fixes */
    body.dark-theme .back-btn { color: #0f172a; }
    body.dark-theme .back-btn:hover { background: #ffffff; color: #0f172a; }

    .back-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-3px); 
      box-shadow: 0 8px 20px var(--shadow-strong); 
    }
  </style>
</head>
<body>

<h1>My Projects</h1>

<div class="project-grid">

  <!-- Project Card Example -->
  <div class="project-card" onclick="window.location.href='projillustrator.html'">
    <img src="image/illustretorlogo.png" alt="Project 3">
  </div>
  
  <div class="project-card" onclick="window.location.href='projillustrato.html'">
    <img src="image/powerpointlogo.png" alt="Project 1">
  </div>

  <div class="project-card" onclick="window.location.href='project2.html'">
    <img src="image/excellogo.png" alt="Project 2">
  </div>

</div>

<center>
  <a href="index.html" class="back-btn">← Back to Portfolio</a>
</center>

<script>
  // ==========================================
  // Theme Synchronization Logic
  // ==========================================
  // This script checks if the user activated Dark Mode on the main page.
  const currentTheme = localStorage.getItem('portfolioTheme');
  if (currentTheme === 'dark') {
    document.body.classList.add('dark-theme');
  }
</script>

</body>
</html>
